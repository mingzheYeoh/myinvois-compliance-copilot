services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: myinvois
      POSTGRES_PASSWORD: myinvois
      POSTGRES_DB: myinvois
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myinvois"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
