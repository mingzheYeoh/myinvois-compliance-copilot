[project]
name = "myinvois-compliance-copilot"
version = "0.1.0"
description = "Agentic RAG assistant for Malaysian LHDN e-Invoice (MyInvois) compliance."
requires-python = ">=3.11,<3.12"
dependencies = [
    "pdfplumber>=0.11",
    "sentence-transformers>=3.0",
    "torch>=2.13",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "python-dotenv>=1.0",
    "langchain-core>=1.6.1",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.6.0",
    "langsmith>=0.12.1",
    "pydantic>=2.13.5",
    "langgraph>=1.2.11",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "slowapi>=0.1.10",
]

[dependency-groups]
dev = ["ruff>=0.6", "pytest>=8.0", "pyyaml>=6.0"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
# The golden set costs real Groq quota, so it is opt-in: `pytest -m slow`.
markers = ["slow: hits the live LLM and spends the daily token budget"]
addopts = "-m 'not slow'"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Torch ships CUDA by default on Linux: 43 nvidia-* packages, ~2.5GB, none of
# which a bge-small embedding on a 1-vCPU Container App will ever call. Pinning
# the CPU index here rather than in the Dockerfile keeps the lock, CI and the
# image resolving the same torch.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
